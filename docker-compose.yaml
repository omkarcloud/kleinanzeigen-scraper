services:
  kleinanzeigen-scraper:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Kleinanzeigen only answers German IPs. Outside Germany (or on a cloud
      # server) set a German residential proxy:
      # - KLEINANZEIGEN_PROXY=http://user:pass@host:port
